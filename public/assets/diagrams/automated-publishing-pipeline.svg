<svg xmlns="http://www.w3.org/2000/svg" width="980" height="860" viewBox="0 0 980 860" role="img" aria-label="Automated publishing pipeline diagram">
  <defs>
    <style>
      :root { color-scheme: light; }
      text { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 800; }
      .subtitle { font-size: 14px; fill: #475569; }
      .box { fill: #ffffff; stroke: #0e3a75; stroke-width: 2.5; rx: 18; ry: 18; }
      .box-soft { fill: #f8fafc; stroke: #0e3a75; stroke-width: 2.5; rx: 18; ry: 18; }
      .box-dark { fill: #0b1e39; stroke: #38bdf8; stroke-width: 2.5; rx: 18; ry: 18; }
      .box-dark text { fill: #e2e8f0; }
      .label { font-size: 18px; font-weight: 800; }
      .meta { font-size: 13px; fill: #334155; }
      .meta-dark { font-size: 13px; fill: #cbd5e1; }
      .arrow { stroke: #0e3a75; stroke-width: 3; fill: none; }
      .arrow-soft { stroke: #0e3a75; stroke-width: 3; fill: none; opacity: 0.9; }
      .panel { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 16; ry: 16; }
      .panel-title { font-size: 16px; font-weight: 800; fill: #0f172a; }
      .panel-text { font-size: 13px; fill: #334155; }
      .chip { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.2; rx: 999; ry: 999; }
      .chip-text { font-size: 12px; fill: #0f172a; font-weight: 600; }
    </style>

    <!-- Arrow marker -->
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0e3a75"></path>
    </marker>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1e39" flood-opacity="0.18"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="860" fill="#ffffff"></rect>
  <rect x="30" y="28" width="920" height="804" class="panel" filter="url(#shadow)"></rect>

  <!-- Title -->
  <text x="70" y="82" class="title">Automated Publishing &amp; Validation Pipeline</text>
  <text x="70" y="108" class="subtitle">Draft → Validate → Build → Release/Deploy → Public Platform</text>

  <!-- Left-side “chips” -->
  <g>
    <rect x="70" y="132" width="170" height="30" class="chip"></rect>
    <text x="86" y="153" class="chip-text">Deterministic Output</text>

    <rect x="250" y="132" width="160" height="30" class="chip"></rect>
    <text x="266" y="153" class="chip-text">Fail Fast &amp; Loud</text>

    <rect x="420" y="132" width="170" height="30" class="chip"></rect>
    <text x="436" y="153" class="chip-text">Validation Gates</text>

    <rect x="600" y="132" width="170" height="30" class="chip"></rect>
    <text x="616" y="153" class="chip-text">Release Discipline</text>
  </g>

  <!-- Diagram layout constants (visually positioned) -->
  <!-- Boxes centered around x=490 -->
  <!-- Box 1: Drafts -->
  <g transform="translate(240,190)">
    <rect width="500" height="86" class="box-soft"></rect>
    <text x="250" y="34" text-anchor="middle" class="label">Drafts</text>
    <text x="250" y="58" text-anchor="middle" class="meta">(Markdown / MDX as source)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 490 276 L 490 318" class="arrow" marker-end="url(#arrowHead)"></path>

  <!-- Box 2: Post creation -->
  <g transform="translate(240,320)">
    <rect width="500" height="104" class="box"></rect>
    <text x="250" y="38" text-anchor="middle" class="label">Post Creation Script</text>
    <text x="250" y="62" text-anchor="middle" class="meta">Structure • Naming • Metadata</text>
    <text x="250" y="84" text-anchor="middle" class="meta">Enforces a consistent baseline</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 490 424 L 490 466" class="arrow" marker-end="url(#arrowHead)"></path>

  <!-- Box 3: Validation Layer -->
  <g transform="translate(240,468)">
    <rect width="500" height="160" class="box"></rect>
    <text x="250" y="38" text-anchor="middle" class="label">Validation Layer</text>

    <text x="250" y="70" text-anchor="middle" class="meta">Internal Links • Routes &amp; Pages</text>
    <text x="250" y="94" text-anchor="middle" class="meta">HTML Output • RSS Integrity</text>
    <text x="250" y="126" text-anchor="middle" class="meta">Any failure halts the pipeline</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 490 628 L 490 670" class="arrow" marker-end="url(#arrowHead)"></path>

  <!-- Box 4: Static Build -->
  <g transform="translate(240,672)">
    <rect width="500" height="104" class="box"></rect>
    <text x="250" y="38" text-anchor="middle" class="label">Static Build</text>
    <text x="250" y="62" text-anchor="middle" class="meta">Deterministic HTML artifacts</text>
    <text x="250" y="84" text-anchor="middle" class="meta">Repeatable across environments</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 490 776 L 490 818" class="arrow" marker-end="url(#arrowHead)"></path>

  <!-- Box 5: Release & Deploy -->
  <g transform="translate(240,820)">
    <rect width="500" height="112" class="box-dark" transform="translate(0,-92)"></rect>
    <text x="250" y="760" text-anchor="middle" class="label" fill="#e2e8f0">Release &amp; Deploy</text>
    <text x="250" y="784" text-anchor="middle" class="meta-dark">Version Tagging • Changelog • Publish</text>
    <text x="250" y="806" text-anchor="middle" class="meta-dark">Predictable CI/CD behavior</text>
  </g>

  <!-- Output box: Public Platform (right column) -->
  <g transform="translate(760,320)">
    <rect width="170" height="306" class="box-soft"></rect>
    <text x="85" y="34" text-anchor="middle" class="label">Public Platform</text>

    <text x="85" y="74" text-anchor="middle" class="meta">Blog Grid</text>
    <text x="85" y="102" text-anchor="middle" class="meta">Posts</text>
    <text x="85" y="130" text-anchor="middle" class="meta">Tags</text>
    <text x="85" y="158" text-anchor="middle" class="meta">Docs</text>
    <text x="85" y="186" text-anchor="middle" class="meta">Projects</text>
    <text x="85" y="214" text-anchor="middle" class="meta">RSS Consumers</text>

    <text x="85" y="258" text-anchor="middle" class="meta">Stable URLs</text>
    <text x="85" y="284" text-anchor="middle" class="meta">Verified Outputs</text>
  </g>

  <!-- Connector from Release & Deploy to Public Platform -->
  <path d="M 740 764 C 800 740, 820 700, 845 630" class="arrow-soft" marker-end="url(#arrowHead)"></path>

  <!-- Control & Enforcement Panel -->
  <g transform="translate(70,640)">
    <rect width="620" height="172" class="panel"></rect>
    <text x="18" y="34" class="panel-title">Control &amp; Enforcement</text>

    <text x="18" y="66" class="panel-text">• Scripts act as the control plane (structure, naming, flow)</text>
    <text x="18" y="92" class="panel-text">• Validation is a release gate (fail fast and loudly)</text>
    <text x="18" y="118" class="panel-text">• Git is the source of truth (traceable, reproducible, auditable)</text>
    <text x="18" y="144" class="panel-text">• Static output is the contract (known artifacts, predictable routing)</text>
  </g>

  <!-- Footer note -->
  <text x="70" y="824" class="subtitle">Tip: Embed this SVG in your project page or README for instant credibility.</text>
</svg>
