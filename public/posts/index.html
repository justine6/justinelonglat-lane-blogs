<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>All Blog Posts</title>
  <meta name="description" content="Browse deep dives on reproducible environments, observability, secure delivery, and sustainable cloud systems." />

  <!-- Favicons (root-safe + GH Pages fallback) -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="/justinelonglat-lane-blogs/favicon.ico?v=2" sizes="any" />

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/css/main.css" />

  <!-- Theme bootstrap (same as your homepage) -->
  <script>
  (function () {
    const root = document.documentElement;
    const KEY = "jlt-theme";
    function apply(theme) { root.setAttribute("data-theme", theme); }
    const saved = localStorage.getItem(KEY);
    apply(saved === "dark" ? "dark" : "light");
    window.__toggleTheme = function () {
      const current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem(KEY, next);
      apply(next);
    };
  })();
  </script>

  <script src="/assets/js/nav-active.js" defer></script>

  <!-- Page-local styles: ONLY for the posts grid/search (keeps your global look) -->
  <style>
    .posts-wrap { padding: 2.25rem 0 3rem; }
    .posts-title { margin: 0 0 1rem; font-size: clamp(2rem, 3vw, 3rem); line-height: 1.05; }

    .posts-search {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.28);
      padding: .85rem 1rem;
      background: rgba(255,255,255,.9);
      box-shadow: 0 12px 35px rgba(2,6,23,.10);
      outline: none;
    }
    html[data-theme="dark"] .posts-search{
      background: rgba(2,6,23,.55);
      border-color: rgba(148,163,184,.18);
      box-shadow: 0 16px 45px rgba(0,0,0,.35);
      color: rgba(226,232,240,.95);
    }
    .posts-search::placeholder { opacity: .75; }

    .posts-grid{
      list-style: none;
      padding: 0;
      margin: 1.25rem 0 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .post-card{
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.62);
      box-shadow: 0 14px 42px rgba(0,0,0,.28);
      padding: 1rem 1rem 1.05rem;
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
      display:flex;
      flex-direction:column;
      gap:.55rem;
      min-height: 150px;
    }
    html[data-theme="light"] .post-card{
      background: rgba(255,255,255,.95);
      border-color: rgba(148,163,184,.25);
      box-shadow: 0 14px 42px rgba(2,6,23,.10);
    }
    .post-card:hover{
      transform: translateY(-2px);
      border-color: rgba(59,130,246,.40);
      box-shadow: 0 18px 56px rgba(0,0,0,.32);
    }
    html[data-theme="light"] .post-card:hover{
      box-shadow: 0 18px 56px rgba(2,6,23,.14);
    }

    .post-card a{
      font-weight: 800;
      text-decoration: none;
      color: inherit;
    }
    html[data-theme="dark"] .post-card a{ color: rgba(226,232,240,.96); }
    html[data-theme="light"] .post-card a{ color: #0f172a; }
    .post-card a:hover{ text-decoration: underline; }

    .post-desc{
      margin: 0;
      opacity: .85;
      font-size: .95rem;
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .post-tags{
      margin-top: auto;
      font-size: .82rem;
      opacity: .75;
      line-height: 1.35;
    }

    .empty{
      padding: 1rem;
      border-radius: 18px;
      border: 1px dashed rgba(148,163,184,.25);
      opacity: .8;
    }
  </style>
</head>

<body>

<!-- Unified header (same as your homepage) -->
<header class="site-header" role="banner">
  <div class="site-header-inner">
    <a class="site-brand" href="/" aria-label="Home">
      <img class="site-logo" src="/assets/img/logo.png" alt="Justine Longla T." />
      <span class="site-brand-text">
        <span class="site-brand-name">Justine Longla T.</span>
        <span class="site-brand-tagline">DevSecOps • Cloud • Sustainability</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/posts/" data-nav="posts">All Blog Posts</a>

      <a
        class="is-primary"
        href="https://justinelonglat-lane.com/engineering-mesh"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="nav-ico">🧩</span>
        Engineering MeshHub
      </a>

      <a href="https://docs.justinelonglat-lane.com/" target="_blank" rel="noopener noreferrer">
        Docs site
      </a>

      <a class="is-primary" href="/docs/" data-nav="toolkit">
        <span class="nav-ico">🛠️</span>
        Automation toolkit
      </a>
    </nav>

    <div class="site-cta-nav" role="group" aria-label="Profile and theme">
      <a
        class="header-profile-pill"
        href="https://justinelonglat-lane.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open main site"
        title="Open main site"
      >
        <img
          src="/assets/img/justine-profile.jpg"
          alt="Justine Longla T."
          class="header-profile-avatar"
          loading="lazy"
          decoding="async"
        />
        <span class="header-profile-label">Justine</span>
      </a>

      <button
        id="theme-toggle"
        class="theme-toggle-pill"
        type="button"
        aria-label="Toggle light/dark mode"
        title="Toggle theme"
        onclick="window.__toggleTheme && window.__toggleTheme(); return false;"
      >
        <span class="theme-icon light">☀️</span>
        <span class="theme-icon dark">🌙</span>
      </button>
    </div>
  </div>
</header>

<main class="container posts-wrap">
  <h1 class="posts-title">All Blog Posts</h1>

  <input
    id="q"
    class="posts-search"
    type="search"
    placeholder="Search posts (title, description, tag)..."
    autocomplete="off"
    aria-label="Search posts"
  />

  <ul id="grid" class="posts-grid" aria-live="polite"></ul>
</main>

<script type="module">
  const $grid = document.getElementById("grid");
  const $q = document.getElementById("q");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function norm(s){ return String(s ?? "").toLowerCase().trim(); }

  function render(items){
    if (!items.length) {
      $grid.innerHTML = '<li class="empty">No matching posts.</li>';
      return;
    }

    $grid.innerHTML = items.map(x => {
      const title = esc(x.title || x.slug || "Untitled");
      const url = esc(x.url || "#");
      const desc = x.description ? `<p class="post-desc">${esc(x.description)}</p>` : `<p class="post-desc"></p>`;
      const tags = Array.isArray(x.tags) ? x.tags : [];
      const tagLine = tags.length ? `<div class="post-tags"># ${esc(tags.join(", "))}</div>` : `<div class="post-tags"></div>`;

      return `
        <li class="post-card">
          <a href="${url}">${title}</a>
          ${desc}
          ${tagLine}
        </li>
      `;
    }).join("");
  }

  async function load(){
    const res = await fetch("/_data/posts.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Failed to load /_data/posts.json: " + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  let all = [];

  function applyFilter(){
    const q = norm($q.value);
    if (!q) return render(all);

    const filtered = all.filter(x => {
      const hay = [
        x.title, x.slug, x.description,
        ...(Array.isArray(x.tags) ? x.tags : [])
      ].map(norm).join(" ");
      return hay.includes(q);
    });

    render(filtered);
  }

  (async function main(){
    try {
      all = await load();
      render(all);
      $q.addEventListener("input", applyFilter);
    } catch (e) {
      console.error(e);
      $grid.innerHTML = '<li class="empty">Unable to load posts right now.</li>';
    }
  })();
</script>

</body>
</html>
