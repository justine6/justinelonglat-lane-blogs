<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>All Blog Posts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{--bg:#fff;--text:#0f172a;--muted:#64748b;--card:#f8fafc;--ring:rgba(2,132,199,.15)}
    html,body{height:100%}
    body{
      margin:0;
      padding:2rem 1.5rem 3rem;
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
      color:var(--text);
      background:var(--bg);
    }
    .container{max-width:960px;margin:0 auto}
    h1{font-size:2rem;margin:0 0 1.25rem}
    ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    li{background:var(--card);border:1px solid #e5e7eb;border-radius:14px;padding:1rem;transition:transform .12s ease, box-shadow .12s ease}
    li:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--ring)}
    a{font-weight:600;text-decoration:none;color:#0ea5e9}
    a:hover{text-decoration:underline}
    .desc{color:var(--muted);margin-top:.35rem}
    .tags{color:var(--muted);font-size:.875rem;margin-top:.35rem}
    .empty{color:var(--muted);font-style:italic}
  </style>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
<!-- inject:header -->
<!-- injected:begin -->
<!-- /partials/site-header.html -->
<header class="site-header" role="banner">
  <div class="site-header-inner">
    <a class="site-brand" href="/" aria-label="Home">
      <img class="site-logo" src="/assets/img/logo.png" alt="Justine Longla T." />
      <span class="site-brand-text">
        <span class="site-brand-name">Justine Longla T.</span>
        <span class="site-brand-tagline">DevSecOps • Cloud • Sustainability</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="/" data-nav="home">Home</a>
      <a href="/posts/" data-nav="posts">All Blog Posts</a>

      <a
        class="is-primary"
        href="https://www.justinelonglat-lane.com/engineering-mesh"
        target="_blank"
        rel="noopener noreferrer"
        data-external="true"
      >
        <span class="nav-ico">🧩</span>
        Engineering MeshHub
      </a>

      <a
        class="nav-highlight"
        href="/series/platform-engineering-framework/"
        data-nav="framework"
        title="Explore the JLT-Lane Platform Engineering Framework"
      >
        Framework
      </a>

      <a
        href="https://docs.justinelonglat-lane.com/"
        target="_blank"
        rel="noopener noreferrer"
        data-external="true"
      >
        Docs site
      </a>

      <a class="is-primary" href="/docs/" data-nav="toolkit">
        <span class="nav-ico">🛠️</span>
        Automation toolkit
      </a>
    </nav>

    <div class="site-cta-nav" role="group" aria-label="Profile and theme">
      <a
        class="header-profile-pill"
        href="https://justinelonglat-lane.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open main site"
      >
        <img
          src="/assets/img/justine-profile.jpg"
          alt="Justine Longla T."
          class="header-profile-avatar"
          loading="lazy"
          decoding="async"
        />
        <span class="header-profile-label">Justine</span>
      </a>

      <button
        id="theme-toggle"
        class="theme-toggle-pill"
        type="button"
        aria-label="Toggle light/dark mode"
        title="Toggle theme"
        onclick="window.__toggleTheme && window.__toggleTheme(); return false;"
      >
        <span class="theme-icon light">☀️</span>
        <span class="theme-icon dark">🌙</span>
      </button>
    </div>
  </div>
</header>
<!-- injected:end -->
<main class="container">
    <h1>All Blog Posts</h1>
    <ul id="list"></ul>
  </main>
  <script type="module">
    async function main() {
      const res = await fetch("/_data/posts.json");
      if (!res.ok) {
        console.error("Failed to load index data", res.status);
        document.getElementById("list").innerHTML =
          '<li class="empty">Unable to load entries.</li>';
        return;
      }

      const data = await res.json();
      const list = document.getElementById("list");

      if (!Array.isArray(data) || !data.length) {
        list.innerHTML = '<li class="empty">No entries yet.</li>';
        return;
      }

      data.forEach(x => {
        const li = document.createElement("li");
        li.innerHTML =
          `<a href="${x.url}">${x.title}</a>` +
          (x.description ? `<div class="desc">${x.description}</div>` : "") +
          (x.tags?.length ? `<div class="tags"># ${x.tags.join(", ")}</div>` : "");
        list.appendChild(li);
      });
    }

    main().catch(console.error);
  </script>
<!-- inject:footer -->
<!-- injected:begin -->
<footer class="site-footer">
  <div class="footer-inner">
    <div>© <span id="year"></span> Justine Longla T.</div>

    <div class="footer-links" aria-label="Footer navigation">
      <a href="https://justinelonglat-lane.com" target="_blank" rel="noopener noreferrer">Top site</a>
      <a href="https://docs.justinelonglat-lane.com" target="_blank" rel="noopener noreferrer">Docs</a>
      <a href="https://blogs.justinelonglat-lane.com" aria-current="page">Blog</a>
    </div>
  </div>

  <script>
    (function () {
      var el = document.getElementById("year");
      if (el) el.textContent = new Date().getFullYear();
    })();
  </script>
</footer>
<!-- injected:end -->
</body>
</html>
