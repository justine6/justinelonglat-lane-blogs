<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>All Blog Posts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* -----------------------------
       ROOT + BASE
    ----------------------------- */
    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#94a3b8;

      --card:#0b1220;
      --card2:#0a1628;
      --card-border:rgba(148,163,184,.18);
      --link:#38bdf8;
      --link-hover:#7dd3fc;

      --shadow:0 14px 40px rgba(2,6,23,.28);
    }

    *{box-sizing:border-box}

    html,body{height:100%}

    body{
      margin:0;
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
      color:var(--text);
      background:var(--bg);
    }

    img{max-width:100%;height:auto;display:block}

    .container{
      max-width:1080px;
      margin:0 auto;
      padding:2.25rem 1.5rem 3.5rem;
    }

    h1{
      font-size:2.1rem;
      margin:0 0 1.5rem;
      letter-spacing:-.02em;
    }

    /* -----------------------------
       HEADER (minimal, safe)
    ----------------------------- */
    .site-header{
      border-bottom:1px solid #e5e7eb;
      background:#fff;
    }

    .header-row{
      max-width:1080px;
      margin:0 auto;
      padding:1rem 1.5rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:.75rem;
      text-decoration:none;
      color:inherit;
      font-weight:700;
    }

    .brand-logo{
      width:44px;
      height:44px;
    }

    .brand-subtitle{
      display:block;
      font-size:.85rem;
      font-weight:500;
      color:var(--muted);
    }

    .site-nav{
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
    }

    .site-nav a{
      text-decoration:none;
      font-weight:600;
      color:#334155;
    }

    .site-nav a:hover{color:#0ea5e9}

    /* -----------------------------
       POSTS GRID
    ----------------------------- */
    ul{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:1.25rem;
    }

    @media (max-width:1200px){ ul{grid-template-columns:repeat(3,1fr)} }
    @media (max-width:900px){ ul{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:560px){ ul{grid-template-columns:1fr} }

    li{
      background:linear-gradient(180deg,var(--card),var(--card2));
      border:1px solid var(--card-border);
      border-radius:18px;
      padding:1.2rem 1.15rem 1.05rem;
      display:flex;
      flex-direction:column;
      min-height:220px;
      transition:.18s ease;
    }

    li:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow);
      border-color:rgba(56,189,248,.32);
    }

    a{
      font-weight:700;
      font-size:1.02rem;
      text-decoration:none;
      color:var(--link);
    }

    a:hover{color:var(--link-hover)}

    .desc{
      margin-top:.55rem;
      color:#cbd5e1;
      font-size:.95rem;
      display:-webkit-box;
      -webkit-line-clamp:5;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .tags{
      margin-top:auto;
      padding-top:.75rem;
      font-size:.85rem;
      color:var(--muted);
      border-top:1px solid rgba(148,163,184,.14);
    }

    .empty{
      background:transparent;
      border:1px dashed rgba(148,163,184,.35);
      color:#64748b;
      font-style:italic;
      min-height:auto;
    }

    /* -----------------------------
       FOOTER (minimal, safe)
    ----------------------------- */
    .site-footer{
      border-top:1px solid #e5e7eb;
      margin-top:3rem;
      background:#020617;
      color:#cbd5e1;
    }

    .footer-inner{
      max-width:1080px;
      margin:0 auto;
      padding:2rem 1.5rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
    }

    .footer-links a{
      color:#94a3b8;
      margin-right:1rem;
      text-decoration:none;
    }

    .footer-links a:hover{color:#38bdf8}
  </style>
</head>
