<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>All Blog Posts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Deep dives on reproducible environments, observability, secure delivery, and sustainable cloud systems." />

  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(2, 6, 23, .72);
      --card: rgba(15, 23, 42, .72);
      --card2: rgba(2, 6, 23, .62);
      --text: #e5e7eb;
      --muted: rgba(226, 232, 240, .74);
      --border: rgba(148, 163, 184, .20);
      --ring: rgba(59, 130, 246, .30);
      --link: #60a5fa;
      --chip: rgba(148, 163, 184, .16);
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --radius: 16px;
    }

    /* Respect your global theme toggle if present */
    html[data-theme="light"]{
      --bg: #ffffff;
      --panel: rgba(255,255,255,.92);
      --card: #ffffff;
      --card2: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(148,163,184,.22);
      --ring: rgba(2,132,199,.18);
      --link: #0284c7;
      --chip: rgba(2,6,23,.06);
      --shadow: 0 16px 50px rgba(2,6,23,.10);
    }

    html,body{height:100%}
    body{
      margin:0;
      color: var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, rgba(59,130,246,.12), transparent 60%),
                  radial-gradient(900px 700px at 80% 20%, rgba(34,197,94,.10), transparent 55%),
                  var(--bg);
      font: 16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
    }

    .container{
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3.25rem;
    }

    .top{
      display:flex;
      flex-direction:column;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .title{
      font-size: clamp(2rem, 3.2vw, 3rem);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .sub{
      margin: .35rem 0 0;
      max-width: 70ch;
      color: var(--muted);
    }

    .bar{
      display:flex;
      flex-wrap:wrap;
      gap: .75rem;
      align-items:center;
      margin-top: .65rem;
    }

    .search{
      flex: 1 1 320px;
      display:flex;
      align-items:center;
      gap: .55rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .65rem .9rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .search svg{opacity:.75}
    .search input{
      width:100%;
      border:0;
      outline:0;
      background: transparent;
      color: var(--text);
      font-size: .98rem;
    }
    .search input::placeholder{color: var(--muted)}

    .meta{
      color: var(--muted);
      font-size: .95rem;
    }

    .grid{
      list-style:none;
      padding:0;
      margin: 1.25rem 0 0;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: var(--shadow);
      padding: 1rem 1rem 1.05rem;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
      backdrop-filter: blur(10px);
      min-height: 150px;
      display:flex;
      flex-direction:column;
      gap: .55rem;
    }

    .card:hover{
      transform: translateY(-2px);
      border-color: rgba(96,165,250,.45);
      box-shadow: 0 22px 70px rgba(0,0,0,.40);
    }

    .card a{
      color: var(--link);
      font-weight: 800;
      text-decoration: none;
      font-size: 1.02rem;
      line-height: 1.25;
    }
    .card a:hover{text-decoration: underline}

    .desc{
      color: var(--muted);
      margin: 0;
      font-size: .95rem;
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .tags{
      margin-top: auto;
      display:flex;
      flex-wrap: wrap;
      gap: .35rem;
      padding-top: .35rem;
    }

    .chip{
      font-size: .82rem;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--chip);
      padding: .22rem .55rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .empty{
      color: var(--muted);
      font-style: italic;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--panel);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top">
      <div>
        <h1 class="title">All Blog Posts</h1>
        <p class="sub">
          Browse the grid, search by title/description/tags, and open deep dives.
        </p>
      </div>

      <div class="bar">
        <div class="search" role="search" aria-label="Search posts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="q" type="search" placeholder="Search posts (title, description, tag)..." autocomplete="off" />
        </div>
        <div class="meta"><span id="count">0</span> posts</div>
      </div>
    </div>

    <ul id="grid" class="grid" aria-live="polite"></ul>
  </main>

  <script type="module">
    const $grid = document.getElementById("grid");
    const $q = document.getElementById("q");
    const $count = document.getElementById("count");

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function norm(s){ return String(s ?? "").toLowerCase().trim(); }

    function render(items){
      $count.textContent = String(items.length);

      if (!items.length) {
        $grid.innerHTML = '<li class="empty">No matching posts.</li>';
        return;
      }

      $grid.innerHTML = items.map(x => {
        const title = esc(x.title || x.slug || "Untitled");
        const url = esc(x.url || "#");
        const desc = x.description ? `<p class="desc">${esc(x.description)}</p>` : `<p class="desc"></p>`;
        const tags = Array.isArray(x.tags) ? x.tags : [];
        const chips = tags.slice(0, 8).map(t => `<span class="chip">#${esc(t)}</span>`).join("");
        return `
          <li class="card">
            <a href="${url}">${title}</a>
            ${desc}
            <div class="tags">${chips}</div>
          </li>
        `;
      }).join("");
    }

    async function load(){
      const res = await fetch("/_data/posts.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load /_data/posts.json: " + res.status);
      return await res.json();
    }

    let all = [];
    let filtered = [];

    function applyFilter(){
      const q = norm($q.value);
      if (!q) {
        filtered = all.slice();
        render(filtered);
        return;
      }
      filtered = all.filter(x => {
        const hay = [
          x.title, x.slug, x.description,
          ...(Array.isArray(x.tags) ? x.tags : [])
        ].map(norm).join(" ");
        return hay.includes(q);
      });
      render(filtered);
    }

    (async function main(){
      try {
        all = await load();
        if (!Array.isArray(all)) all = [];
        render(all);
        $q.addEventListener("input", applyFilter);
      } catch (e) {
        console.error(e);
        $grid.innerHTML = '<li class="empty">Unable to load posts right now.</li>';
      }
    })();
  </script>
</body>
</html>
