<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All Blog Posts</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="/assets/css/main.css" />

  <!-- Theme bootstrap -->
  <script>
  (function () {
    const root = document.documentElement;
    const KEY = "jlt-theme";
    function apply(theme) { root.setAttribute("data-theme", theme); }
    const saved = localStorage.getItem(KEY);
    apply(saved === "dark" ? "dark" : "light");
    window.__toggleTheme = function () {
      const current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem(KEY, next);
      apply(next);
    };
  })();
  </script>

  <script src="/assets/js/nav-active.js" defer></script>
</head>

<body>

<!-- 🔹 SAME HEADER AS HOMEPAGE -->
<header class="site-header" role="banner">
  <div class="site-header-inner">
    <a class="site-brand" href="/" aria-label="Home">
      <img class="site-logo" src="/assets/img/logo.png" alt="Justine Longla T." />
      <span class="site-brand-text">
        <span class="site-brand-name">Justine Longla T.</span>
        <span class="site-brand-tagline">DevSecOps • Cloud • Sustainability</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/posts/" data-nav="posts">All Blog Posts</a>
      <a class="is-primary" href="https://justinelonglat-lane.com/engineering-mesh" target="_blank" rel="noopener noreferrer">Engineering MeshHub</a>
      <a href="https://docs.justinelonglat-lane.com/" target="_blank" rel="noopener noreferrer">Docs site</a>
      <a class="is-primary" href="/docs/" data-nav="toolkit">Automation toolkit</a>
    </nav>
  </div>
</header>

<main class="container" style="padding:2.5rem 0 3rem;">
  <h1 style="margin-bottom:1rem;">All Blog Posts</h1>

  <input
    id="q"
    class="posts-search"
    type="search"
    placeholder="Search posts (title, description, tag)..."
    autocomplete="off"
    aria-label="Search posts"
    style="width:100%;padding:.9rem 1rem;border-radius:999px;border:1px solid rgba(148,163,184,.28);margin-bottom:1.5rem;"
  />

  <ul id="grid" class="posts-grid"></ul>
</main>

<script type="module">
  const $grid = document.getElementById("grid");
  const $q = document.getElementById("q");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function norm(s){ return String(s ?? "").toLowerCase().trim(); }

  function render(items){
    if (!items.length) {
      $grid.innerHTML = '<li class="empty">No matching posts.</li>';
      return;
    }

    $grid.innerHTML = items.map(x => `
      <li class="post-card">
        <a href="${esc(x.url)}">${esc(x.title)}</a>
        <p class="post-desc">${esc(x.description || "")}</p>
        <div class="post-tags"># ${(x.tags || []).join(", ")}</div>
      </li>
    `).join("");
  }

  async function load(){
    const res = await fetch("/_data/posts.json", { cache: "no-store" });
    return res.ok ? res.json() : [];
  }

  let all = [];

  function applyFilter(){
    const q = norm($q.value);
    if (!q) return render(all);
    render(all.filter(x => [x.title, x.description, ...(x.tags||[])].map(norm).join(" ").includes(q)));
  }

  (async function main(){
    all = await load();
    render(all);
    $q.addEventListener("input", applyFilter);
  })();
</script>

</body>
</html>
